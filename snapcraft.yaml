name: melonds-emulator
base: core24
version: '1.1'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Nintendo DS and DSi emulator
description: |
   melonDS aims at providing fast and accurate Nintendo DS emulation. While it is still a work in progress, it has a pretty solid set of features.

    Nearly complete core (CPU, video, audio, ...)
    OpenGL renderer, 3D upscaling
    RTC, microphone, lid close/open
    Joystick support
    Savestates
    Various display position/sizing/rotations modes
    Work-in-progress Wi-Fi emulation for online connectivity and local multiplayer
    Experimental emulation of the Nintendo DSi
    ...and even more is planned!
grade: stable
confinement: strict
icon: melon.svg

apps:
  melonds-emulator:
    command-chain: [force-snap-common-folder]
    command: melonDS
    desktop: net.kuribo64.melonDS.desktop
    common-id: net.kuribo64.melonDS
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    extensions: [kde-neon-6]
    plugs:
      - unity7
      - screen-inhibit-control
      - audio-playback
      - network
      - network-bind
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez

plugs:
  shared-memory:
    private: true

parts:
  melonds-app:
    plugin: dump
    source:
      - on amd64: https://github.com/melonDS-emu/melonDS/releases/download/$SNAPCRAFT_PROJECT_VERSION/melonDS-$SNAPCRAFT_PROJECT_VERSION-ubuntu-x86_64.zip
      - on arm64: https://github.com/melonDS-emu/melonDS/releases/download/$SNAPCRAFT_PROJECT_VERSION/melonDS-$SNAPCRAFT_PROJECT_VERSION-ubuntu-aarch64.zip
    prime:
      - melonDS
      
  dependencies:
    after: [melonds-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libenet7
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libenet.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*

  dot-desktop:
    after: [dependencies]
    plugin: nil
    build-packages: [curl]
    override-build: |
      curl -o $CRAFT_PART_INSTALL/net.kuribo64.melonDS.desktop https://raw.githubusercontent.com/melonDS-emu/melonDS/refs/heads/master/res/net.kuribo64.melonDS.desktop
      echo "StartupWMClass=net.kuribo64.melonDS" >> "$CRAFT_PART_INSTALL/net.kuribo64.melonDS.desktop"

  command-chain:
    after: [dot-desktop]
    plugin: dump
    source: ./sh/